{% extends "base.html" %}
{% block title %}Log in - NAVORA{% endblock %}
{% block content %}
<section class="section"><div class="wrap" style="max-width:440px">
  <div class="card">
    <h1 style="font-size:1.7rem">Welcome back</h1>
    <form method="post" novalidate>
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email" value="{{ email }}"></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password"></div>
      <button class="btn btn-primary" style="width:100%">Log in</button>
    </form>
    <p class="small muted" style="margin-top:14px">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
    <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
    <form method="post" action="{{ url_for('auth.demo_login') }}"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button class="btn btn-ghost" style="width:100%">Try the demo student (B.Tech IT, Cybersecurity)</button></form>
  </div>
</div></section>
{% endblock %}
